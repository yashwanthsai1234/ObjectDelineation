name: tests

# Runners: https://docs.github.com/en/actions/using-github-hosted-runners/about-github-hosted-runners
# (ubuntu-24.04-arm in private repositories, 2 vCPUs:
#  https://github.blog/changelog/2026-01-29-arm64-standard-runners-are-now-available-in-private-repositories)
# Wheels: https://cibuildwheel.pypa.io/en/stable/setup/#github-actions
# Third-party actions are pinned to full commit SHAs, release tag in the comment
# (https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions).
# setup-uv publishes no major/minor tags since v8.0.0 (https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0).

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: lint + pytest (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]  # Linux x86-64, Linux arm64, macOS arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"  # builds objdel._gpucheck (CPU build) with scikit-build-core + nanobind
      - run: .venv/bin/python -m ruff check src tests experiments
      - run: .venv/bin/lint-imports --no-logo
      - run: .venv/bin/python -m pytest -q -m "not slow"

  train:
    name: pytest with the training stack + coverage (K13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv venv --python 3.12
      # CPU-only torch from download.pytorch.org/whl/cpu (no CUDA wheels); the CPU index has no macOS wheels, so
      # this job is Linux only. https://docs.astral.sh/uv/guides/integration/pytorch/
      - run: uv pip install -e ".[dev,data,train]" --torch-backend cpu
      - run: .venv/bin/python -m pytest -q -m "not slow" --cov=objdel --cov-report=term-missing:skip-covered --cov-fail-under=90

  gates:
    name: K1/K2 exhaustive oracle runs (slow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv venv --python 3.12
      - run: uv pip install -e ".[dev]"
      - run: .venv/bin/python -m pytest -q -s -m slow tests/test_checker_oracle.py

  wheels:
    name: wheels (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]  # manylinux x86_64, manylinux aarch64, macOS arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: pypa/cibuildwheel@b3395e271a35f73dad77f21802abe9b986dfe299  # v4.3.1
        env:
          CIBW_ARCHS: native  # one native architecture per runner, no emulation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
