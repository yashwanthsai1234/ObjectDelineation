name: links

# Third-party actions are pinned to full commit SHAs, release tag in the comment.
on:
  pull_request:
    paths: ['**/*.md']
  schedule:
    - cron: '0 6 * * 1'  # weekly

permissions:
  contents: read

jobs:
  links:
    name: external links (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}
          restore-keys: cache-lychee-
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: --no-progress --cache --max-cache-age 1d '**/*.md'
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        if: always()
        with:
          path: .lycheecache
          key: cache-lychee-${{ github.sha }}

  rollback-build:
    name: docs site with Material (rollback check, not blocking)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: uv venv --python 3.12
      - run: uv pip install mkdocs-material==9.8.1 mkdocs-api-autonav==0.4.0 mkdocstrings-python==2.0.10
      - run: NO_MKDOCS_2_WARNING=1 .venv/bin/mkdocs build --strict
