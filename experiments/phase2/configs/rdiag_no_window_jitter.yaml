# R-diag (PLAN §6.3) rule 3, CT window jitter off; R1's design to the failing run's selected depth only (one decay; set branches).
model: lfm2.5-vl-450m
view: views/lidc-bundle-nowin   # build_views --epochs 3 --no-window-jitter --out data/views/lidc-bundle-nowin
output_dir: rdiag-no_window_jitter
seed: 1
sampler: hf   # D13 fallback (V1 R0 parity failed)
branches: [1.0]   # = the failing run's selected depth (the deepest when none was eligible)
vision: {prepared: prepared, reference: vision_ref/lfm2.5-vl-450m.json}   # reference: written in R0 by --vision_reference_only true (under run_dir)
sft:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch 32 (D5)
  dataloader_num_workers: 6
  dataloader_persistent_workers: true
  gradient_checkpointing: false    # R0 peak memory decides (§6.0)
