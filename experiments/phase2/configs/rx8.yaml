# R-x8 (PLAN §6.1, owner approval): one A0' seed, non-simple rows x8, at the C2 depth.
model: qwen3-vl-2b   # = the C1 rung (rung 2 now; PLAN §1)
view: views/lidc-bundle-v2-x8   # build_views --nonsimple-repeat 8
output_dir: rx8
seed: 1
sampler: hf   # D13: the HF sampler for every model
branches_from: r1-qwen3vl2b/g_probe/g_probe.json   # branches = [depth of the checkpoint with the final G-probe verdict]
stages: [train, topology]   # Vast runner (policy.chain)
vision: {prepared: prepared, reference: vision_ref/qwen3-vl-2b.json}   # reference: written in R0 by --vision_reference_only true (under run_dir)
sft:
  per_device_train_batch_size: 4   # as r1_qwen3vl2b.yaml
  gradient_accumulation_steps: 8   # effective batch 32 (D5)
  dataloader_num_workers: 6
  dataloader_persistent_workers: true
