# R-x8 (PLAN §6.1, owner approval): one A0' seed, non-simple rows x8, at the C2 depth.
model: lfm2.5-vl-450m   # = the C1 rung
view: views/lidc-bundle-x8   # build_views --nonsimple-repeat 8
output_dir: rx8
seed: 1
sampler: hf   # D13 fallback: R0 parity (2026-11-02, RTX 4090) failed H-A5-2 seq_p99 for LFM 1.11 and Qwen3.5 1.44 (> 0.5)
branches_from: r1-lfm/g_probe/g_probe.json   # branches = [depth of the checkpoint with the final G-probe verdict]
stages: [train, topology]   # Vast runner (policy.chain)
vision: {prepared: prepared, reference: vision_ref/lfm2.5-vl-450m.json}   # reference: written in R0 by --vision_reference_only true (under run_dir)
sft:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch 32 (D5)
  dataloader_num_workers: 6
  dataloader_persistent_workers: true
  gradient_checkpointing: false    # R0 peak memory decides (§6.0)
