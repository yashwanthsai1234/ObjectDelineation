# B1 run (Implementation.md B1.5; rental V1 items 1-3, front 6.2): the plan file run.sh runs; never stamped (its
# launch config is b1_launch.yaml). From the R5 start model rl-full-3ep ({rd}/ckpt, fetched by fetch_hf.sh), 260
# steps on the ordered rows root (build_rl_rows, B1.4), --shared-prefix, LR 5e-5 (R5 and the full run), beta 1e-3 and
# mask_truncated_completions true (configs.grpo_config defaults), control numerics bf16-seqmask (no --numerics: B2.2
# is not on this tag), BudgetStop at $2.05 of session spend (V1 $2.40 - $0.35 tail, front 6.4 rule 5; run.sh exports
# the session start, rate and fixed cost).
#   0  the CUDA build (else every reward and eval scores on the CPU build) and the scorer parity on it
#   1  env_check.sh
#   2  the GPU smoke by node id (an empty -k selection exits 5 and stops the chain)
#   3  train_rl, soft (~): a crash goes on to 3b
#   3b train_rl --merge-last: final/ from the last checkpoint when 3 did not reach its own save; no-op otherwise
#   4  one final_eval process: the B1 final model on lidc-val-shifted, then lidc-val-edge (A3's repeated --view)
# R5 on lidc-val-edge is a3_measure.yaml (front item 4), run right after this plan's EXIT.
# --rows-revision and --rows-manifest-sha256: the uploaded root (svenk029/objdel-sft rows/lidc-train-b1, uploaded 2026-11-09,
# 8,320 rows, all hard data gates pass); train_rl and preflight check both against the fetched root.
#   fetch_hf.sh <run> rl-full-3ep && fetch_hf.sh <run> --rows <rows_revision> lidc-train-b1
#   run.sh <run> experiments/phase2/configs/b1_rows.yaml
# {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc.
steps:
  - [bash, -c, "bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c \"import objdel._gpucheck as g; assert g.build() == 'cuda'\" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/test_gpu_scoring.py"]
  - [bash, experiments/phase2/docker/env_check.sh, "{rd}/ckpt", "{rd}/env_check.json"]
  - [-m, pytest, -m, gpu, "tests/test_train_fast.py::test_g02_is_summary_no_sync", "tests/test_train_fast.py::test_g08a_smoke"]
  - ["~", -m, experiments.phase2.train_rl, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --train, "{data}/rows/lidc-train-b1",
     --out, "{rd}/b1-rows", --steps, "260", --save-steps, "50", --shared-prefix, --lr, "5e-5",
     --rows-revision, "34213dceb068128f1a1abf9c67aa65dd59bc1220",
     --rows-manifest-sha256, "472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4", --budget-usd, "2.05"]
  - [-m, experiments.phase2.train_rl, --merge-last, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --out, "{rd}/b1-rows"]
  - [-m, experiments.phase2.final_eval, --ckpt, "{rd}/b1-rows/final", --train, "{data}/prepared",
     --view, "{data}/eval_views/lidc-val-shifted", --split, val, --out, "{rd}/eval_b1_val_shifted",
     --view, "{data}/eval_views/lidc-val-edge", --split, val, --out, "{rd}/eval_b1_val_edge"]
