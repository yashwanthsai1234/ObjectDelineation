# R1 rung 2 (owner decision 2026-11-02, replaces the LFM and Qwen3.5 rungs): Qwen3-VL-2B, LM-only LoRA r16 (D6).
# Same bundle recipe as r1_lfm.yaml: A0', seed 1. Owner 2026-11-05: WSD 3 epochs + decay branches 0.5 / 1 / 2 / 3.
model: qwen3-vl-2b
view: views/lidc-bundle-v3   # lidc-bundle-v2 (scale ladder, PLAN §6.0) built with --epochs 4: epochs 0-2 byte-identical to v2
output_dir: r1-qwen3vl2b
seed: 1
sampler: vllm   # owner 2026-11-05 (option A, D13): vLLM samples the exam; select_ckpt's HF check on the selected branch
branches: [0.5, 1.0, 2.0, 3.0]   # the e3 branch decays to 3.45 epochs: needs 4 view epochs
vision: {prepared: prepared, reference: vision_ref/qwen3-vl-2b.json}   # written in R0 by --vision_reference_only true
sft:
  per_device_train_batch_size: 4   # not 8: Qwen3-VL's 152k-token vocabulary makes the logits of a long batch ~12 GB
  gradient_accumulation_steps: 8   # effective batch 32 (D5)
  dataloader_num_workers: 6
  dataloader_persistent_workers: true
  # gradient checkpointing is on for this model (configs.sft_config)
