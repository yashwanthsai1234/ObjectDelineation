# R0 Qwen3.5 arm (D1): 30 steps of full FT with the bundle config, workers 6, discarded (cap 0.3 h).
model: qwen3.5-0.8b
view: views/lidc-bundle
output_dir: r0-qwen35-arm
seed: 1
steps_per_epoch: 30
branches: []   # stable only, nothing saved (BK3-14)
vision: off   # discarded timing run: no G-vision (BK3-4)
rolling_minutes: 1000
sft:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  dataloader_num_workers: 6
  dataloader_persistent_workers: true
  logging_steps: 1
