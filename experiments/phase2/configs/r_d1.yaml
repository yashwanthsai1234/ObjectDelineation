# R-D1 (Implementation.md D1 step 4; V2 item 4, optional): the kernel drafts K1 and K2 on one RTX 5090 (their
# GPU_RUN.md steps 1-5, docs/implementation2.0/kernels/K1, K2), then the engine bench. Tree rule: it runs only on a
# tree where D2 has not merged (after D2, check_masks is the K1 port and cross_numpy would compare K1 with itself).
# Inputs: the synced code (/workspace/src: cuda/, the kernel drafts, the bench) and the LIDC bundle ({data}:
# checker_eval/masks.npz, prepared/lidc/val.jsonl, prepared/caches/lidc/). Outputs: {rd}/k1, {rd}/k2, {rd}/d1, brought
# back by pull.sh. A "~" step may fail without stopping the chain: a K1 failure must not cost the K2 and bench minutes.
# {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc. Commands (Mac):
#   make preflight CONFIG=specs/c_speed.yaml   (the V2 launch config, front section 6.1)
#   sync_up.sh <run>   (code + the LIDC bundle), then run.sh <run> experiments/phase2/configs/r_d1.yaml, pull.sh <run>
steps:
  # toolkit (nvcc 13.0.88, CCCL, NVTX, compute-sanitizer 13.4.92 into /opt/venv) and the engine's CUDA build
  - [bash, -c, "bash /workspace/src/experiments/cuda_checker/run_box.sh --build-only"]
  # K1 steps 1-2: CPU builds, the 37,093 crops as raw files (cross-checked against the numpy polygonizer), GPU build
  - ["~", bash, -c, "K1=/workspace/src/docs/implementation2.0/kernels/K1; W={rd}/k1; CU=/opt/venv/lib/python3.12/site-packages/nvidia/cu13;
     mkdir -p $W && bash $K1/build_cpu.sh /workspace/src/cuda > $W/build_cpu.txt 2>&1 &&
     /opt/venv/bin/python -I $K1/cross_numpy.py $K1/build/cpu/k1_dump_cpu $W/lidc --masks {data}/checker_eval/masks.npz
     2>&1 | tee $W/cross_numpy.txt && NVCC=$CU/bin/nvcc bash $K1/build_gpu.sh /workspace/src/cuda sm_120 > $W/build_gpu.txt 2>&1"]
  # K1 steps 3-5: exactness (3000 21, 3000 22; seed rows 16 and 0), memcheck and initcheck, speed
  - ["~", bash, -c, "set -o pipefail; K1=/workspace/src/docs/implementation2.0/kernels/K1; W={rd}/k1; G=$K1/build/gpu;
     S=/opt/venv/lib/python3.12/site-packages/nvidia/cu13/bin/compute-sanitizer;
     $G/test_k1_gpu 3000 21 2>&1 | tee $W/test_gpu.txt && $G/test_k1_gpu 3000 22 2>&1 | tee -a $W/test_gpu.txt &&
     $G/k1_dump_gpu $W/lidc/in $W/out16.bin 16 2>&1 | tee $W/dump_gpu.txt &&
     $G/k1_dump_gpu $W/lidc/in $W/out0.bin 0 2>&1 | tee -a $W/dump_gpu.txt &&
     timeout 300 $S --tool memcheck --leak-check full --error-exitcode 1 $G/test_k1_gpu 25 5 > $W/san_mem.txt 2>&1 &&
     timeout 300 $S --tool initcheck --error-exitcode 1 $G/test_k1_gpu 10 6 > $W/san_init.txt 2>&1 &&
     $G/bench_k1_gpu 10 $W/lidc/in 2>&1 | tee $W/bench_gpu.txt"]
  # K2 steps 2-5: GPU and CPU builds, digests (seed 20261108, scales 1 and 4), four sanitizers, speed
  - ["~", bash, -c, "set -o pipefail; K2=/workspace/src/docs/implementation2.0/kernels/K2; W={rd}/k2;
     CU=/opt/venv/lib/python3.12/site-packages/nvidia/cu13; export PATH=$CU/bin:$PATH; cd $K2 && mkdir -p build $W &&
     nvcc -std=c++17 -O3 -arch=sm_120 --fmad=false -Xcompiler -ffp-contract=off -lineinfo --resource-usage
     -x cu -c k2.cpp -o build/k2_gpu.o 2> $W/ptxas.txt &&
     for f in k2ref k2test k2bench; do g++ -std=c++17 -O2 -ffp-contract=off -c $f.cpp -o build/$f.o || exit 1; done &&
     nvcc -arch=sm_120 build/k2_gpu.o build/k2ref.o build/k2test.o -o build/k2test_gpu &&
     nvcc -arch=sm_120 build/k2_gpu.o build/k2ref.o build/k2bench.o -o build/k2bench_gpu &&
     g++ -std=c++17 -O2 -ffp-contract=off k2.cpp k2ref.cpp k2test.cpp -o build/k2test_cpu &&
     g++ -std=c++17 -O2 -ffp-contract=off k2.cpp k2ref.cpp k2bench.cpp -o build/k2bench_cpu &&
     ./build/k2test_gpu 20261108 1 | tee $W/test_gpu_s1.txt && ./build/k2test_cpu 20261108 1 | tee $W/test_cpu_s1.txt &&
     ./build/k2test_gpu 20261108 4 | tee $W/test_gpu_s4.txt && ./build/k2test_cpu 20261108 4 | tee $W/test_cpu_s4.txt &&
     for t in memcheck synccheck initcheck racecheck; do timeout 300 $CU/bin/compute-sanitizer --tool $t
     --error-exitcode 1 ./build/k2test_gpu 20261108 1 > $W/san_$t.txt 2>&1 || exit 1; done &&
     ./build/k2bench_gpu 1 3 | tee $W/bench_gpu.txt && ./build/k2bench_cpu 8 1 | tee $W/bench_cpu_box.txt"]
  # the engine bench (D1): inputs under the LIDC bundle, never a relative data/ path
  - ["~", bash, -c, "OBJDEL_DATA_ROOT={data} /opt/venv/bin/python -I -m experiments.phase2.perf.bench_checker
     --engine current --stages --out {rd}/d1/bench.json"]
