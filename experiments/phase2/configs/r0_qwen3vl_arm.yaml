# R0 timing arm: 30 steps with r1_qwen3vl2b.yaml's settings, discarded. Gives s/step and peak memory for
# project_r1 (the stop rule). The first batch is the longest one (length grouping), so its peak is the worst case.
model: qwen3-vl-2b
view: views/lidc-bundle-v2
output_dir: r0-qwen3vl-arm
seed: 1
steps_per_epoch: 30
branches: []   # stable only, nothing saved (BK3-14)
vision: off   # discarded timing run: no G-vision (BK3-4)
rolling_minutes: 1000
sft:
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  dataloader_num_workers: 6
  dataloader_persistent_workers: true
  logging_steps: 1
