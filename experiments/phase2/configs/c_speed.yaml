# V2 items 2 and 3 (Implementation.md front 6.3, C0): the plan file run.sh runs; never stamped (its launch config is
# c_launch.yaml). One preset for both arms, the B3 control: bf16-seqmask with the merged push (no --numerics), the B1
# rows root and its pins (b1_rows.yaml), --shared-prefix, one whole 20-step block per 17-step arm. Every step is hard:
# policy.cmd_run joins them with &&, so a failed check ends the plan and the next arm never starts.
#   0  the CUDA build and the scorer parity on it (b1_rows.yaml step 0: the C arms score on the GPU)
#   1  env_check.sh (the vLLM, torch and nsys versions of the box)
#   2  c_speed_check --pixels --sync: makes its 5 batches first ({rd}/c_check/batches), G-EQ1, G-SY1..SY3
#      (--encoder, G-EN0 and G-EN1, joins with C3: the fast arm below then also needs {rd}/c_check/encoder.json)
#   3  the baseline arm: today's code, flags off, sleep on; A6's nsys capture on steps 16-17 (--profile-window)
#   4  the fast arm, mode A (vLLM awake): C1, C2, C4, C5 flags; steps 1-17 are timed, steps 18-40 are the check arm in
#      the same process (--checks-from-step 18: every check, every batch recorded to {rd}/c_check/arm_batches). After
#      step 1 it compares step 1 with the baseline's (--expect-step1, E-EQ6) and exits 3 on a mismatch, so no later
#      step runs. NSYS_TIMEOUT 1800: the capture window ends at step 17, the process goes on to step 40.
# The synthetic-input box tests of tests/test_c_gpu.py (G-PX2.., G-RM2, G-DT1) join as one pytest step after step 2,
# with --deselect of the two vLLM tests that run in c_speed_c6.yaml and b3_v5.yaml, once those tests exist.
# The fast arm gains --encoder-once when C3 lands. {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc.
#   fetch_hf.sh <run> rl-full-3ep && fetch_hf.sh <run> --rows <rows_revision> lidc-train-b1
#   run.sh <run> experiments/phase2/configs/c_speed.yaml
steps:
  - [bash, -c, "bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c \"import objdel._gpucheck as g; assert g.build() == 'cuda'\" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/test_gpu_scoring.py"]
  - [bash, experiments/phase2/docker/env_check.sh, "{rd}/ckpt", "{rd}/env_check.json"]
  - [-m, experiments.phase2.c_speed_check, --pixels, --sync, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt",
     --train, "{data}/rows/lidc-train-b1", --out, "{rd}", --steps, "20", --shared-prefix,
     --rows-revision, "34213dceb068128f1a1abf9c67aa65dd59bc1220",
     --rows-manifest-sha256, "472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4"]
  - [bash, -c, "bash experiments/phase2/docker/nsys_capture.sh {rd} c0_base 16 17 -- /opt/venv/bin/python -I -m experiments.phase2.train_rl --model qwen3-vl-2b --ckpt {rd}/ckpt --train {data}/rows/lidc-train-b1 --rows-revision 34213dceb068128f1a1abf9c67aa65dd59bc1220 --rows-manifest-sha256 472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4 --out {rd}/c0_base --steps 20 --save-steps 1000 --shared-prefix"]
  - [bash, -c, "NSYS_TIMEOUT=1800 bash experiments/phase2/docker/nsys_capture.sh {rd} c_fast 16 17 -- /opt/venv/bin/python -I -m experiments.phase2.train_rl --model qwen3-vl-2b --ckpt {rd}/ckpt --train {data}/rows/lidc-train-b1 --rows-revision 34213dceb068128f1a1abf9c67aa65dd59bc1220 --rows-manifest-sha256 472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4 --out {rd}/c_fast --steps 40 --save-steps 1000 --shared-prefix --gpu-pixels auto --prompt-memo --host-meta --fast-sync --grpo '{{\"vllm_enable_sleep_mode\": false}}' --checks-from-step 18 --check-rope-every 1 --check-meta-every 1 --record-batches {rd}/c_check/arm_batches --expect-step1 {rd}/c0_base/rl.json --encode-check {rd}/c_check/encoder.json"]
