# V2 item 3c, run.sh's own call after c_speed.yaml (Implementation.md front 6.3, C0): the mode B fast arm (vLLM asleep
# between phases), only when mode A failed G-MEM; never stamped. Why its own check steps: a mode A crash before step
# 18 ends c_speed.yaml with no check-arm batches, so mode B writes its own ({rd}/c_check/arm_batches_b, the folder
# G-EQ2 and G-EQ3 read when this arm is the adopted one). No build step: c_speed.yaml step 0 built the CUDA checker in
# /opt/venv. It reads the baseline's rl.json and the encoder.json that c_speed.yaml made.
#   0  the fast arm, mode B: as c_speed.yaml step 4 with vllm_enable_sleep_mode true
steps:
  - [bash, -c, "NSYS_TIMEOUT=1800 bash experiments/phase2/docker/nsys_capture.sh {rd} c_fast_b 16 17 -- /opt/venv/bin/python -I -m experiments.phase2.train_rl --model qwen3-vl-2b --ckpt {rd}/ckpt --train {data}/rows/lidc-train-b1 --rows-revision 34213dceb068128f1a1abf9c67aa65dd59bc1220 --rows-manifest-sha256 472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4 --out {rd}/c_fast_b --steps 40 --save-steps 1000 --shared-prefix --gpu-pixels auto --prompt-memo --host-meta --fast-sync --grpo '{{\"vllm_enable_sleep_mode\": true}}' --checks-from-step 18 --check-rope-every 1 --check-meta-every 1 --record-batches {rd}/c_check/arm_batches_b --expect-step1 {rd}/c0_base/rl.json --encode-check {rd}/c_check/encoder.json"]
