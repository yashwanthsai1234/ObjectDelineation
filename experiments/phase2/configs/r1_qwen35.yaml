# R1 screening, rung 2: Qwen3.5-0.8B with LM-only LoRA r16 (D6: R0's full-FT arm OOMed, see `lora`).
model: qwen3.5-0.8b
view: views/lidc-bundle   # build_views --epochs 3 (the 2-epoch branch decays into epoch 3)
output_dir: r1-qwen35
seed: 1
sampler: hf   # D13 fallback: R0 parity (2026-11-02, RTX 4090) failed H-A5-2 seq_p99 for LFM 1.11 and Qwen3.5 1.44 (> 0.5)
branches: [0.5, 1.0, 2.0]
lora: true    # D6 (LoRA r16, LR 5e-4, saved merged) when full FT peaks above 20 GiB: R0 (2026-11-02, RTX 4090) OOMed at step 0, > 23.4 GiB
vision: {prepared: prepared, reference: vision_ref/qwen3.5-0.8b.json}   # reference: written in R0 by --vision_reference_only true (under run_dir)
sft:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4   # effective batch 32 (D5)
  dataloader_num_workers: 6
  dataloader_persistent_workers: true
  gradient_checkpointing: false    # R0 peak memory decides (§6.0)
