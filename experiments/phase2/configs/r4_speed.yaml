# R4 speed test (owner 2026-11-08, ~$0.50): today's train_rl code on e2 for 15 steps twice on one RTX 5090.
# New since the full run: the vLLM sync pushes W + delta without writing the bf16 base (trl #6688), chunks round to
# 64 wide (not the 8 compile buckets), and time/sync_s, time/wake_s, time/sleep_s time the colocate handovers.
#   arm 1 (asleep): the full run's settings; its steps should match the full run's (~27.5 s, legal ~0.93 at step 1)
#   arm 2 (awake):  vllm_enable_sleep_mode false (vLLM keeps its 0.35 of the card; the trainer peaked at 17 GB);
#                   "~" so an out-of-memory does not stop the chain
# Compare steps 3-15 (steps 1-2 warm up). Neither arm saves checkpoints; each writes rl.json and a merged final.
# {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc.
#   make preflight CONFIG=experiments/phase2/configs/r1_qwen3vl2b.yaml
#   offers.sh RTX_5090 --pick ID
#   launch.sh OFFER r4 --config experiments/phase2/configs/r1_qwen3vl2b.yaml --cap-hours 1.2 --owner-approved
#   sync_up.sh r4 && fetch_hf.sh r4 r1-qwen3vl2b
#   run.sh r4 experiments/phase2/configs/r4_speed.yaml && teardown.sh r4
steps:
  - ["~", bash, -c, "(lscpu; nproc; cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu*/cpu.cfs_*_us; nvidia-smi -q; df -h /dev/shm) > {rd}/box.txt 2>&1"]
  - [bash, experiments/phase2/docker/env_check.sh, "{rd}/ckpt", "{rd}/env_check.json"]
  - [-m, experiments.phase2.train_rl, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --train, "{data}/prepared",
     --out, "{rd}/asleep", --steps, "15", --save-steps, "1000"]
  - ["~", -m, experiments.phase2.train_rl, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --train, "{data}/prepared",
     --out, "{rd}/awake", --steps, "15", --save-steps, "1000", --grpo, '{{"vllm_enable_sleep_mode": false}}']
