# B3 run (Implementation.md B3.9; rental V3 item 4, front 6.3): the plan file run.sh runs; never stamped (its launch
# config is b3_launch.yaml). Against B1 (b1_rows.yaml) only these change: --reward v5 (location term, RLOO; LocGuard
# on), mask_truncated_completions false (ADR-0014), beta = 1e-3 / r and adam_epsilon = 1e-8 / r (B3.7 rule 6; r = 1
# below until the lab round measures it). Same start model rl-full-3ep ({rd}/ckpt), same rows root and revision,
# 260 steps, --shared-prefix, LR 5e-5, numerics bf16-seqmask (no --numerics: train_rl's default), max completion
# length 1,536 and no runaway cap. BudgetStop $2.20 (V3 amount rule, items 0 + 4; raise it when V3 items 1-3 run).
#   0  the CUDA build and the scorer parity on it (b1_rows.yaml step 0)
#   1  the G08b smoke (reward v5 sums checked on the box before they train anything); bash -c sets the data root
#   2  the B1 re-eval: {rd}/b1/final (fetch_hf.sh <run> b1-rows --as b1) on lidc-val-shifted and lidc-val-edge
#   3  train_rl, soft (~): a crash goes on to 3b
#   3b train_rl --merge-last: final/ from the last checkpoint when 3 did not reach its own save; no-op otherwise
#   4  the B3 val eval (one final_eval process, shifted then edge); D's S13 reads eval_b3_val_shifted
#   5  C's G-RC0 box check by node id, soft (blocks only C11, never B3)
# --rows-revision and --rows-manifest-sha256 are B1's (zero placeholders until B1.4 step 5 writes them in b1_rows.yaml;
# copy the same values here). {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc.
steps:
  - [bash, -c, "bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c \"import objdel._gpucheck as g; assert g.build() == 'cuda'\" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/test_gpu_scoring.py"]
  - [bash, -c, "OBJDEL_DATA_ROOT={data} /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider -m gpu tests/test_train_fast.py::test_g08b_smoke"]
  - [-m, experiments.phase2.final_eval, --ckpt, "{rd}/b1/final", --train, "{data}/prepared",
     --view, "{data}/eval_views/lidc-val-shifted", --split, val, --out, "{rd}/eval_b1v3_val_shifted",
     --view, "{data}/eval_views/lidc-val-edge", --split, val, --out, "{rd}/eval_b1v3_val_edge"]
  - ["~", -m, experiments.phase2.train_rl, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --train, "{data}/rows/lidc-train-b1",
     --out, "{rd}/b3-v5", --steps, "260", --save-steps, "50", --shared-prefix, --lr, "5e-5", --reward, v5,
     --grpo, '{{"mask_truncated_completions": false, "beta": 0.001, "adam_epsilon": 1e-08}}',
     --rows-revision, "34213dceb068128f1a1abf9c67aa65dd59bc1220",
     --rows-manifest-sha256, "472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4", --budget-usd, "2.20"]
  - [-m, experiments.phase2.train_rl, --merge-last, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --out, "{rd}/b3-v5"]
  - [-m, experiments.phase2.final_eval, --ckpt, "{rd}/b3-v5/final", --train, "{data}/prepared",
     --view, "{data}/eval_views/lidc-val-shifted", --split, val, --out, "{rd}/eval_b3_val_shifted",
     --view, "{data}/eval_views/lidc-val-edge", --split, val, --out, "{rd}/eval_b3_val_edge"]
  - ["~", -m, pytest, -q, -p, no:cacheprovider, -m, gpu, "tests/test_c_gpu.py::test_g_rc0_per_row_caps"]
