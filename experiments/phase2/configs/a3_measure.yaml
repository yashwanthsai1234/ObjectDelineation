# A3 (rental V1 items 4-5; front 6.2): R5 (HF svenk029/objdel-sft, revision rl-full-3ep, test IoU_tc 0.645) on the two
# frozen val views in one process (the fixed load of about 205 s is paid once): lidc-val-edge first (Gate B1's edge
# baseline), then lidc-val-shifted (A-G3: paired with runs/r5/eval/eval_val/items.jsonl). Every answer is saved
# (answers.jsonl) before scoring; after pull.sh, final_eval --rescore on the Mac must reproduce the box's checker
# terms to the bit. No --split test here: the test half is a3_test.yaml (rental V3 item 3). No nsys step (the A6
# capture is the C0 baseline arm of V2). env_check.sh and the CUDA build already ran in b1_rows.yaml on this box;
# step 2 builds only if the CUDA build is missing (V2 item 1b), so R5 is never scored on the CPU build.
# A literal { or } in a step is written {{ or }}: policy.chain formats every step with {rd} and {data}.
#   .venv/bin/python -I -m experiments.phase2.check_series_z     # B1.7 first: no eval view is hashed before it
#   .venv/bin/python -I -m experiments.phase2.build_eval_views --split test --kinds shifted --out data/eval_views --procs 6
#   .venv/bin/python -I -m experiments.phase2.final_eval --hash-view data/eval_views/lidc-test-shifted --out runs/a3/pre_rental.json
#   # B1.6 builds lidc-val-edge and freezes it in docs/reference/frozen_views.json
#   .venv/bin/python -I -m experiments.phase2.vast.bundle lidc --view lidc-bundle-v3
#   make preflight CONFIG=experiments/phase2/configs/b1_launch.yaml   # the V1 launch config (front 6.2); never a plan file
#   # rental V1 items 4-5, after items 1-3 (b1_rows.yaml); front 6.2 owns the list, minutes and cap
#   # not skippable; no output -> rental V2 item 1b (front 6.3)
#   sync_up.sh <run> && fetch_hf.sh <run> rl-full-3ep
#   run.sh <run> experiments/phase2/configs/a3_measure.yaml && pull.sh <run>
#   # at the end of V1, not after A3 (also after an error; front 6.4 rule 6):
#   teardown.sh <run> && sweep_orphans.sh
# {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc.
steps:
  - ["~", bash, -c, "(lscpu; nproc; nvidia-smi -q; df -h /dev/shm) > {rd}/box.txt 2>&1"]
  - [bash, -c, "/opt/venv/bin/python -I -c 'import objdel._gpucheck as g; assert g.build() == \"cuda\"' || (bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c 'import objdel._gpucheck as g; assert g.build() == \"cuda\"')"]
  - [-m, experiments.phase2.final_eval, --ckpt, "{rd}/ckpt", --train, "{data}/prepared",
     --view, "{data}/eval_views/lidc-val-edge", --split, val, --out, "{rd}/eval_val_edge",
     --view, "{data}/eval_views/lidc-val-shifted", --split, val, --out, "{rd}/eval_val"]
