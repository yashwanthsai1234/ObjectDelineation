# R2: tune R1's selected branch e2 with GRPO (PLAN §5.1 G-probe: 20 steps at the pre-registered LoRA LR 5e-5, G = 8,
# 32 prompts per step, a 128-item shifted-val probe before and after) on an RTX 5090, after the same card and checker
# checks as P1. {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc.
#
# OWNER DECISION NEEDED: R1's e2 failed G-geometry and G-precision (runs/r1/r1-qwen3vl2b/select/selected.json), and
# §5.1 runs G-probe only after the gates pass (`g_probe --select` then skips). This chain uses `--ckpt`, which probes
# e2 regardless: an explicit override of §5.1.
#
# Estimate (RTX 5090 US/CA offers $0.57-0.65/h on 2026-11-06; P1 measured 44 s per GRPO step, but 45 min from launch
# to the first run.sh, not 17): card + checker + sanitizers ~7 min, model load + vLLM a few min, 20 steps ~16 min,
# 3 probe draws of 128 items x 8: a chain of ~30-35 min. The chain's timeout is min(run cap, launch deadline - now -
# 10 min) and the deadline is launch + cap + 10 min, so the launch cap is the one that binds. A timeout kills g_probe
# before it writes g_probe.json: launch with --cap-hours 1.7 (worst case ~$1.18) and run the Mac commands back to
# back. Expect ~$0.85-0.95. The post-P1 trainer changes (C5, C10, by_length, no LoRA input cast) are CPU-tested and
# traced against TRL 1.17.1 but first GPU run: r2 (see docs/results/runs.md); a crash shows at step 1, after ~10-15 paid minutes.
# Commands (Mac), preflight LAST (any later edit makes its stamp stale and launch.sh refuses):
#   make preflight CONFIG=experiments/phase2/configs/r1_qwen3vl2b.yaml
#   offers.sh RTX_5090 --pick top
#   launch.sh OFFER r2 --config experiments/phase2/configs/r1_qwen3vl2b.yaml --cap-hours 1.7
#   sync_up.sh r2 && fetch_hf.sh r2 r1-qwen3vl2b      # e2 -> {rd}/ckpt (needs the repo-scoped HF token)
#   run.sh r2 experiments/phase2/configs/r2_qwen3vl2b.yaml && teardown.sh r2
steps:
  - ["~", bash, -c, "(lscpu; nproc; cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu*/cpu.cfs_*_us; nvidia-smi -q; df -h /dev/shm) > {rd}/box.txt 2>&1"]
  # 5090 + CUDA 13 stack: capability, bf16 peak, Triton, torch.compile, a vLLM engine on e2 with CUDA graphs
  - [bash, experiments/phase2/docker/env_check.sh, "{rd}/ckpt", "{rd}/env_check.json"]
  # The CUDA checker: build for this card; run_box.sh runs the GPU tests (arena reuse, two-stream chunks), the
  # equivalence suite (0 mismatches against polycore's recorded results) and the timing sweep; then the scorers on the GPU.
  - [bash, -c, "set -o pipefail; DATA={data}/checker_eval bash experiments/cuda_checker/run_box.sh; s=$?;
     mkdir -p {rd}/cuda_checker; cp -r experiments/cuda_checker/results experiments/cuda_checker/RESULTS.md
     {rd}/cuda_checker/ 2>/dev/null; [ $s = 0 ] || exit $s; /opt/venv/bin/python -m pytest -q -p no:cacheprovider
     tests/test_gpu_scoring.py 2>&1 | tee {rd}/cuda_checker/pytest.txt"]
  # Memory errors in the checker: compute-sanitizer 13.4.92 (installed by run_box.sh), memcheck then
  # initcheck (arena reuse), torch's caching allocator off so its pool does not hide out-of-bounds accesses; recorded,
  # does not stop the chain, but a missing binary or any error fails the step
  - ["~", bash, -c, "S=$(ls /opt/venv/lib/python3.12/site-packages/nvidia/cu13/bin/compute-sanitizer 2>/dev/null);
     O={rd}/cuda_checker/memcheck.txt; [ -n \"$S\" ] || {{ echo no compute-sanitizer > $O; exit 1; }};
     export PYTORCH_NO_CUDA_MEMORY_CACHING=1; for t in memcheck initcheck; do echo == $t >> $O;
     timeout 1200 $S --tool $t --error-exitcode 1 /opt/venv/bin/python -m pytest -q -p no:cacheprovider
     tests/test_cuda_checker_gpu.py tests/test_cuda_checker.py tests/test_checker_host.py
     tests/test_reward_one_checker_call.py tests/test_gpu_scoring.py >> $O 2>&1 || exit 1; done"]
  # RL: the pre-registered G-probe on e2 (fast.FastGRPO, vLLM colocate, GPU checker rewards): verdict, gain, timing
  - [-m, experiments.phase2.g_probe, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --train, "{data}/prepared",
     --probe, "{data}/eval_views/lidc-val-shifted", --out, "{rd}/g_probe"]
