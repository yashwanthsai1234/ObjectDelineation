# The one implementation-2.0 GPU test rental (plan file run by run.sh; never stamped; its launch config is
# impl2_gpu_launch.yaml). It proves on the RTX 5090 what the Mac cannot: the CUDA build, `make gpu-check`, the eval
# path on a slice of the shifted val view, and a 20-step RL smoke on the B1 rows root with one lost-run recovery
# (--merge-last, then --resume). It is a test of the machinery: no step reads a result as a gate, the eval slice is not
# a number to quote, and nothing is pushed to HF.
#
#   0  CUDA build + scorer parity on it (hard: every later reward and eval must score on the CUDA build)
#   1  env_check.sh on {rd}/ckpt (hard)
#   2  make gpu-check = run_box.sh --gpu-check (D8): pytest -m gpu on D's list, 4 compute-sanitizer tools, determinism,
#      benches. Soft: the exit code goes to {rd}/gpu_check.exit and the outputs to {rd}/d/ ($OUT), pull.sh brings them
#   3  B's two GPU smokes by node id (soft)
#   4  final_eval smoke: R5 on 32 evenly spaced items of lidc-val-shifted (soft; --limit, final_eval.limit_rows)
#   5  train_rl smoke, 20 steps (one whole block of the B1 schedule), checkpoint every 10 steps (soft)
#   6  simulate a lost run: keep checkpoint-10 only (hard: nothing to recover otherwise)
#   7  train_rl --merge-last: final/ from checkpoint-10, rl.json partial true, steps 10 (soft); 7b asserts and moves it
#   8  train_rl --resume to step 20 from checkpoint-10 (soft); 8b asserts resumed_from, steps 20, final and adapter
#   9  final_eval smoke of the resumed final model, 16 items (soft)
# Results to pull: {rd}/d/, gpu_check.exit, smoke_eval_r5/, smoke-rl/rl.json, rl_run1.json, rl_partial10.json,
# smoke_eval_final/, and the log impl2_gpu_test.log.
#
# Money (front 6, rules and planning inputs; tests/test_impl2_gpu_plan.py recomputes this block). Approved $2.20, so
# --cap-hours = floor_to_0.05((2.20 - b) / r_s) = floor_to_0.05(2.10 / 0.680) = 3.05 at the planning rate. Recompute
# it from the picked offer: b = 15 x inet_down_cost, r_s = dph_total + 6 x inet_up_cost. A typical RTX 5090 offer
# ($0.60/h, $0.005/GB) gives b 0.075, r_s 0.630, cap 3.35; use the offer's own numbers, never this comment. The cap
# is a guard, not a forecast: the minutes below sum to about 2.2 h, so the expected spend is about $1.6.
# --budget-usd 1.85 = approved - 0.35 (front 6.4 rule 5): the RL steps stop and save there.
budget:
  approved_usd: 2.20
  planning_dph_usd: 0.641            # front 6: the offer limit, the highest rate the launch accepts
  planning_gb_usd: 0.0065            # front 6: bandwidth ceiling per GB, up and down
  fixed_gb_down: 15                  # policy.DOWN_GB
  gb_up_per_h: 6                     # policy.UP_GB_PER_H
  cap_hours: 3.05
  budget_stop_usd: 1.85
  ledger_closed_usd: 16.90           # measured: ledger.csv, 2026-11-08 (hard stop 19.90 = 16.90 + 3.00)
  minutes:                           # worst case, front 6.2 and D.8 estimates
    launch_to_first_run: 38          # sync, bundle, HF downloads of the checkpoint and the rows root (up to 38.2)
    build: 3
    env_check: 1
    gpu_check: 44                    # D.8: 25-44
    gpu_smoke: 5
    eval_smoke_r5: 6.2               # 205 s fixed + 32 x 0.193 s + 2.6 imports
    rl_run1: 15.2                    # 6 start-up + 20 x 27.5 s
    merge_last: 2
    rl_resume: 10.6                  # 6 start-up + 10 x 27.5 s
    eval_smoke_final: 6.0
# Before the launch (the owner or the main agent). The rows pins below are the uploaded root (rows/lidc-train-b1,
# B1.4 step 5); b1_rows.yaml holds the same two values and the test checks that they are equal:
#   fetch_hf.sh <run> rl-full-3ep && fetch_hf.sh <run> --rows <rows_revision> lidc-train-b1
#   run.sh <run> experiments/phase2/configs/impl2_gpu_test.yaml
# {rd} = /workspace/runs/<run_id>, {data} = /workspace/data/lidc.
steps:
  - [bash, -c, "bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c \"import objdel._gpucheck as g; assert g.build() == 'cuda'\" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/test_gpu_scoring.py"]
  - [bash, experiments/phase2/docker/env_check.sh, "{rd}/ckpt", "{rd}/env_check.json"]
  - ["~", bash, -c, "OBJDEL_DATA_ROOT={data} PY=/opt/venv/bin/python bash experiments/cuda_checker/run_box.sh --gpu-check; rc=$?; echo $rc > {rd}/gpu_check.exit; exit $rc"]
  - ["~", -m, pytest, -m, gpu, "tests/test_train_fast.py::test_g02_is_summary_no_sync", "tests/test_train_fast.py::test_g08a_smoke"]
  - ["~", -m, experiments.phase2.final_eval, --ckpt, "{rd}/ckpt", --train, "{data}/prepared",
     --view, "{data}/eval_views/lidc-val-shifted", --split, val, --out, "{rd}/smoke_eval_r5", --limit, "32"]
  - ["~", -m, experiments.phase2.train_rl, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --train, "{data}/rows/lidc-train-b1",
     --out, "{rd}/smoke-rl", --steps, "20", --save-steps, "10", --shared-prefix, --lr, "5e-5",
     --rows-revision, "34213dceb068128f1a1abf9c67aa65dd59bc1220",
     --rows-manifest-sha256, "472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4", --budget-usd, "1.85"]
  - [bash, -c, "d={rd}/smoke-rl; [ -f $d/rl.json ] && [ -d $d/trainer/checkpoint-10 ] && [ -d $d/trainer/checkpoint-20 ] && mv $d/rl.json {rd}/rl_run1.json && rm -rf $d/final $d/final_adapter $d/trainer/checkpoint-20"]
  - ["~", -m, experiments.phase2.train_rl, --merge-last, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --out, "{rd}/smoke-rl"]
  - ["~", bash, -c, "/opt/venv/bin/python -I -c \"import json; d = json.load(open('{rd}/smoke-rl/rl.json')); assert d['partial'] is True and d['steps'] == 10, d\" && mv {rd}/smoke-rl/rl.json {rd}/rl_partial10.json && mv {rd}/smoke-rl/final {rd}/smoke-rl/final_partial10"]
  - ["~", -m, experiments.phase2.train_rl, --model, qwen3-vl-2b, --ckpt, "{rd}/ckpt", --train, "{data}/rows/lidc-train-b1",
     --out, "{rd}/smoke-rl", --steps, "20", --save-steps, "10", --shared-prefix, --lr, "5e-5", --resume,
     --rows-revision, "34213dceb068128f1a1abf9c67aa65dd59bc1220",
     --rows-manifest-sha256, "472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4", --budget-usd, "1.85"]
  - ["~", bash, -c, "/opt/venv/bin/python -I -c \"import json; d = json.load(open('{rd}/smoke-rl/rl.json')); assert d['steps'] == 20 and str(d['resumed_from']).endswith('checkpoint-10'), d\" && [ -d {rd}/smoke-rl/final ] && [ -d {rd}/smoke-rl/final_adapter ]"]
  - ["~", -m, experiments.phase2.final_eval, --ckpt, "{rd}/smoke-rl/final", --train, "{data}/prepared",
     --view, "{data}/eval_views/lidc-val-shifted", --split, val, --out, "{rd}/smoke_eval_final", --limit, "16"]
