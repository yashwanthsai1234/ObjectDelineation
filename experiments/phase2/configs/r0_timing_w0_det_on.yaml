# R0 timing prelude (PLAN §4.7 step 8): 30 steps from R1's init, discarded; workers 0, deterministic on.
model: lfm2.5-vl-450m
view: views/lidc-bundle
output_dir: r0-timing-w0-det-on
seed: 1
steps_per_epoch: 30
branches: []   # stable only, nothing saved (BK3-14)
vision: off   # discarded timing run: no G-vision (BK3-4)
rolling_minutes: 1000
deterministic: true   # D24: use_deterministic_algorithms(warn_only), not sft.full_determinism
sft:
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 4
  dataloader_num_workers: 0
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null   # only with workers > 0 (BK3-1)
  logging_steps: 1
