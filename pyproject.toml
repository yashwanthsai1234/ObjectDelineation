[project]
name = "objdel"
version = "0.1.0"
description = "Certified geometry checker for masks and polygons, used as a verifiable RL reward"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.0",
]

[project.optional-dependencies]
models = [
    "torch>=2.4",
    "transformers>=4.57",
    "accelerate>=1.0",
    "qwen-vl-utils>=0.0.10",
    "opencv-python-headless>=4.10",
]
data = ["pydicom>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/objdel"]

[tool.hatch.build]
# Editable installs also expose the repo root, so `python -I -m experiments.<phase>.<script>` works.
dev-mode-dirs = ["src", "."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Lab prototypes are frozen evidence for experiments/phase1/PLAN.md; production code is linted when promoted.
extend-exclude = ["experiments/phase1/lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Phase scripts are frozen records of what produced the published numbers: lint lightly.
"experiments/**" = ["E501", "B023", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["objdel", "experiments"]
