[project]
name = "objdel"
version = "0.1.0"
description = "Certified geometry checker for masks and polygons, used as a verifiable RL reward"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.0",
    "opencv-python-headless==5.0.0.93",  # Spaghetti labeling; pinned because topology results are hashed (plan §6)
    "pyarrow>=20",  # data store (Parquet); imported by objdel.data
    "numba==0.68.0",  # target simplifier kernels; pinned because the target-set hash depends on it
]

[project.optional-dependencies]
# Pinned training stack (plan D8, §6); reward/target hashes are recorded against these versions.
train = [
    "torch==2.14.1",
    "transformers==5.20.1",
    "trl==1.17.1",
    "datasets==5.1.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "torchvision==0.29.1",  # pairs with torch 2.14.1; transformers/TRL vision-model image processing
]
data = ["pydicom>=3.0", "pylidc==0.2.3"]
dev = [
    "pytest>=8.0", "pytest-cov>=6.0", "hypothesis>=6.100", "ruff==0.17.1",
    "matplotlib>=3.9",  # pylidc-parity oracle
    "pyyaml>=6.0",  # experiments/phase2/vast/policy.py reads run configs (in the training lock via transformers)
]

[build-system]
# Pinned: the extension's machine code depends on them (plan §6).
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# https://scikit-build-core.readthedocs.io/en/latest/configuration/index.html
# Editable installs (make setup) use the default redirect mode: Python files are read from src/objdel, new
# modules need no reinstall, the extension is rebuilt by `make build` (also run by `make test` when cpp/ changed).
# CMakeLists.txt adds the repo root to sys.path in editable installs, for `python -I -m experiments.<phase>.<script>`.
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"   # persistent, so rebuilds are incremental
cmake.build-type = "Release"
wheel.packages = ["src/objdel"]
wheel.py-api = "cp312"            # stable ABI (nanobind STABLE_ABI): one cp312-abi3 wheel per platform
wheel.exclude = ["**.cpp"]

[tool.cibuildwheel]
# https://cibuildwheel.pypa.io/en/stable/options/  (make wheels; CI job "wheels")
build = "cp312-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-requires = ["pytest", "hypothesis"]
test-sources = ["tests", "experiments", "pyproject.toml", "CMakeLists.txt"]
test-command = "python -m pytest -q -m 'not slow' -p no:cacheprovider tests/test_checker_oracle.py tests/test_cuda_checker.py tests/test_checker_host.py"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running exhaustive runs (deselect with -m \"not slow\")",
    "data: needs data/fixtures or data/store (skipped when absent)",
]

[tool.coverage.run]
# Measure code run in multiprocessing.Pool workers (objdel.train.dataset.prepare) and threads.
# https://coverage.readthedocs.io/en/latest/config.html#run-concurrency
concurrency = ["multiprocessing", "thread"]
parallel = true
# Forked reward-pool workers (objdel.train.serve) start coverage from this file, not from --cov: without a source
# they also trace tests/ and experiments/ and the report counts those files against objdel.
source_pkgs = ["objdel"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Lab prototypes are frozen evidence for experiments/phase1/PLAN.md; production code is linted when promoted.
extend-exclude = ["experiments/phase1/lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Phase scripts are frozen records of what produced the published numbers: lint lightly.
"experiments/**" = ["E501", "B023", "B905"]

[tool.ruff.lint.isort]
known-first-party = ["objdel", "experiments"]
