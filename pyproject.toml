[project]
name = "objdel"
version = "0.1.0"
description = "Certified geometry checker for masks and polygons, used as a verifiable RL reward"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.0",
    "opencv-python-headless==5.0.0.93",  # Spaghetti labeling; pinned because topology results are hashed (plan §6)
    "pyarrow>=20",  # data store (Parquet); imported by objdel.data
    "numba==0.68.0",  # target simplifier kernels; pinned because the target-set hash depends on it
    "pydantic>=2.14,<3", "pydantic-settings>=2.16,<3", "pyyaml>=6.0",  # objdel.core.spec: the typed run spec (specs/*.yaml)
]

[project.scripts]
objdel = "objdel.cli.main:main"  # `objdel <group> <command>`: runs objdel.cli.<group>.<command> under python -I

[project.optional-dependencies]
# Pinned training stack (plan D8, §6); reward/target hashes are recorded against these versions.
train = [
    "torch==2.14.1",
    "transformers==5.20.1",
    "trl==1.17.1",
    "datasets==5.1.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "torchvision==0.29.1",  # pairs with torch 2.14.1; transformers/TRL vision-model image processing
]
data = ["pydicom>=3.0", "pylidc==0.2.3"]
serve = ["fastapi==0.136.3", "uvicorn==0.54.0"]  # objdel.verify.http, the verifier service (not used by training)
dev = [
    "pytest>=8.0", "pytest-cov>=6.0", "pytest-xdist==3.8.0", "hypothesis>=6.100", "ruff==0.17.1",
    "matplotlib>=3.9",  # pylidc-parity oracle
    "vulture==2.16",  # `make dead`
    "import-linter==2.16",  # `make lint`: layer contracts
    "httpx==0.28.1",  # FastAPI TestClient (tests/verify)
]
# Docs site (DOC3, ADR-0012). Rollback, not installed: mkdocs-material==9.8.1, mkdocs-api-autonav==0.4.0.
docs = ["zensical==0.1.0", "mkdocstrings-python==2.0.10"]

[build-system]
# Pinned: the extension's machine code depends on them (plan §6).
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# https://scikit-build-core.readthedocs.io/en/latest/configuration/index.html
# Editable installs (make setup) use the default redirect mode: Python files are read from src/objdel, new
# modules need no reinstall, the extension is rebuilt by `make build` (also run by `make test` when cpp/ changed).
# CMakeLists.txt adds the repo root to sys.path in editable installs, for `python -I -m tools.<folder>.<script>`.
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"   # persistent, so rebuilds are incremental
cmake.build-type = "Release"
wheel.packages = ["src/objdel"]
wheel.py-api = "cp312"            # stable ABI (nanobind STABLE_ABI): one cp312-abi3 wheel per platform
wheel.exclude = ["**.cpp"]

[tool.cibuildwheel]
# https://cibuildwheel.pypa.io/en/stable/options/  (make wheels; CI job "wheels")
build = "cp312-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-requires = ["pytest", "hypothesis"]
test-sources = ["tests", "tools", "pyproject.toml", "CMakeLists.txt"]
test-command = "python -m pytest -q -m 'not slow' -p no:cacheprovider tests/geom/test_checker_oracle.py tests/geom/test_cuda_checker.py tests/geom/test_checker_host.py"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: long-running exhaustive runs (deselect with -m \"not slow\")",
    "data: needs data/fixtures or data/store (skipped when absent)",
    "gpu: needs the CUDA build on a GPU box (skipped on the CPU build)",
    "sanitizer: runs under compute-sanitizer in make gpu-check (small fixed corpus)",
    "docs_build: needs the docs extra and builds the site (make docs)",
    "post_commit: reads the git index (and archive/); owner and CI only, never the box (make gpu-check deselects it)",
]

[tool.coverage.run]
# Measure code run in multiprocessing.Pool workers (objdel.data.prepare.prepare) and threads.
# https://coverage.readthedocs.io/en/latest/config.html#run-concurrency
concurrency = ["multiprocessing", "thread"]
parallel = true
# Forked workers (prepare's pool) start coverage from this file, not from --cov: without a source
# they also trace tests/ and tools/ and the report counts those files against objdel.
source_pkgs = ["objdel"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Archived code is frozen evidence (archive/*/README.md); it is never linted.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID", "D100", "D101", "D102", "D103", "D104", "D106"]
ignore = ["E731", "E741"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tool scripts (several are frozen records of what produced the published numbers): lint lightly.
"tools/**" = ["E501", "B023", "B905", "D"]
"tests/goldens/make_*.py" = ["E501", "B023", "B905"]  # the golden writers moved from experiments/
"tests/**" = ["D"]
"src/objdel/cli/*/*.py" = ["E501", "D103"]  # the command modules moved from experiments/ keep their light lint
"src/objdel/rl/trl_adapter.py" = ["TID251"]   # the one TRL adapter (E5)
"tests/rl/test_trl_adapter.py" = ["TID251"]
"tests/rl/test_prepare_inputs.py" = ["TID251"]  # asserts TRL's shuffle_sequence_dict is never swapped (E5)
"tests/experiments/test_trl_adapter_equivalence.py" = ["TID251"]
"src/objdel/rl/vllm_sync.py" = ["TID251"]  # vllm_generation.empty_cache (C5)
"tests/rl/test_vllm_sync.py" = ["TID251"]
"tests/experiments/test_breakit_r1_rl.py" = ["TID251"]
"tests/experiments/test_c_flags.py" = ["TID251"]
"tools/checker/bench.py" = ["TID251"]  # --engine old runs in the pre-E venv (D-G7): no objdel.geom
"tests/experiments/test_bench_checker.py" = ["TID251"]
"tests/geom/test_geom_engine.py" = ["TID251"]  # compares geom.engine with the extension itself
"tests/variants.py" = ["TID251"]  # checks which built extension a variant venv loads            # C5 --lora-sync test patches vllm_generation.LLM

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Dotted names that import-linter cannot forbid. Each ban is added when its task lands.
"trl.trainer.grpo_trainer".msg = "private TRL module: only objdel.rl.trl_adapter may import it"
"trl.generation.vllm_generation".msg = "private TRL module: only objdel.rl.trl_adapter may import it"
"objdel._gpucheck".msg = "the CUDA extension: import objdel.geom.engine (E3a)"

[tool.ruff.lint.isort]
known-first-party = ["objdel", "tools", "tests"]

[tool.vulture]
# Dead-code gate (`make dead`, tests/experiments/test_repo_hygiene.py). Each group below is used by name from outside the code.
paths = ["src", "tools", "tests"]
min_confidence = 60
ignore_decorators = ["@pytest.fixture", "@model_validator", "@app.*"]  # autouse fixtures; pydantic validators (core.spec); FastAPI routes (verify/http.py)
ignore_names = [
  "on_*", "should_save", "should_training_stop",  # transformers TrainerCallback hooks and control flags
  "_get_train_sampler", "_inner_training_loop", "_generate_single_turn",  # Trainer / GRPOTrainer overrides and fakes
  "cmd_*",  # objdel.infra.vast subcommands, dispatched by name
  "pytestmark", "pre_tokenizer", "decoder", "projector_hidden_size", "is_main_process",
  "writeable", "atexit",  # numpy flag (topology.py), atexit hook (cache.py)
  "rid", "multimodal_fields", "has_tool_images", "return_tensors",  # fake signatures that callers use by keyword
  "clean_store", "no_nvtx_calls", "no_load", "mutant", "lora_request",  # fixtures requested by name for their side effect
  "repo_id", "trial", "stream", "num_images", "pixel_attention_mask", "image_sizes", "num_tiles", "spatial_shapes", "token_type_ids", "image_position_ids", "_save_checkpoint",  # fakes of library signatures
  "schema_version", "compute",  # objdel.core.spec RunSpec fields, read by pydantic and the YAML specs
  "record_old_names",  # tests/core/test_layers.py: run by hand to re-record a golden (goldens README)
  "current_gradient_accumulation_steps",  # Trainer attribute that the code under test reads
  "TransferSyntaxUID", "MediaStorageSOPInstanceUID", "MediaStorageSOPClassUID",  # pydicom file-meta that save_as reads
]

[tool.importlinter]
root_package = "objdel"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"  # the E8 target form (Implementation.md E0 table, E8.4): exhaustive, no ignore_imports
name = "objdel layers"
type = "layers"
containers = ["objdel"]
layers = ["cli", "infra", "rl | sft", "policy", "data", "verify", "geom", "core"]
exhaustive = true
exhaustive_ignores = ["_gpucheck"]
broken_contract_guidance = "Move the import down or the code up, or inject the dependency (docs/architecture/layers.md)."

[[tool.importlinter.contracts]]
id = "pure-core"
name = "the verifier side never imports the ML stack"
type = "forbidden"
source_modules = ["objdel.core", "objdel.geom", "objdel.verify", "objdel.data"]
forbidden_modules = ["torch", "trl", "transformers", "peft", "vllm", "datasets", "accelerate"]
broken_contract_guidance = "torch and friends live in objdel.policy / rl / sft only (docs/architecture/layers.md)."
