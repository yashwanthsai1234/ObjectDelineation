[project]
name = "objdel"
version = "0.1.0"
description = "Certified geometry checker for masks and polygons, used as a verifiable RL reward"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.0",
    "opencv-python-headless==5.0.0.93",  # Spaghetti labeling; pinned because topology results are hashed (plan §6)
    "pyarrow>=20",  # data store (Parquet); imported by objdel.data
    "numba==0.68.0",  # target simplifier kernels; pinned because the target-set hash depends on it
    "pydantic>=2.11", "pydantic-settings>=2.16,<3", "pyyaml>=6.0",  # objdel.core.spec: the typed run spec (specs/*.yaml)
]

[project.optional-dependencies]
# Pinned training stack (plan D8, §6); reward/target hashes are recorded against these versions.
train = [
    "torch==2.14.1",
    "transformers==5.20.1",
    "trl==1.17.1",
    "datasets==5.1.0",
    "peft==0.21.2",
    "accelerate==1.15.0",
    "torchvision==0.29.1",  # pairs with torch 2.14.1; transformers/TRL vision-model image processing
]
data = ["pydicom>=3.0", "pylidc==0.2.3"]
dev = [
    "pytest>=8.0", "pytest-cov>=6.0", "pytest-xdist==3.8.0", "hypothesis>=6.100", "ruff==0.17.1",
    "matplotlib>=3.9",  # pylidc-parity oracle
    "vulture==2.16",  # `make dead`
    "import-linter==2.16",  # `make lint`: layer contracts
]

[build-system]
# Pinned: the extension's machine code depends on them (plan §6).
requires = ["scikit-build-core==1.1.1", "nanobind==3.1.0"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# https://scikit-build-core.readthedocs.io/en/latest/configuration/index.html
# Editable installs (make setup) use the default redirect mode: Python files are read from src/objdel, new
# modules need no reinstall, the extension is rebuilt by `make build` (also run by `make test` when cpp/ changed).
# CMakeLists.txt adds the repo root to sys.path in editable installs, for `python -I -m experiments.<phase>.<script>`.
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"   # persistent, so rebuilds are incremental
cmake.build-type = "Release"
wheel.packages = ["src/objdel"]
wheel.py-api = "cp312"            # stable ABI (nanobind STABLE_ABI): one cp312-abi3 wheel per platform
wheel.exclude = ["**.cpp"]

[tool.cibuildwheel]
# https://cibuildwheel.pypa.io/en/stable/options/  (make wheels; CI job "wheels")
build = "cp312-*"
skip = "*-musllinux_*"
build-verbosity = 1
test-requires = ["pytest", "hypothesis"]
test-sources = ["tests", "experiments", "pyproject.toml", "CMakeLists.txt"]
test-command = "python -m pytest -q -m 'not slow' -p no:cacheprovider tests/test_checker_oracle.py tests/test_cuda_checker.py tests/test_checker_host.py"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running exhaustive runs (deselect with -m \"not slow\")",
    "data: needs data/fixtures or data/store (skipped when absent)",
    "gpu: needs the CUDA build on a GPU box (skipped on the CPU build)",
    "sanitizer: runs under compute-sanitizer in make gpu-check (small fixed corpus)",
]

[tool.coverage.run]
# Measure code run in multiprocessing.Pool workers (objdel.train.dataset.prepare) and threads.
# https://coverage.readthedocs.io/en/latest/config.html#run-concurrency
concurrency = ["multiprocessing", "thread"]
parallel = true
# Forked reward-pool workers (objdel.train.serve) start coverage from this file, not from --cov: without a source
# they also trace tests/ and experiments/ and the report counts those files against objdel.
source_pkgs = ["objdel"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Archived code is frozen evidence (archive/*/README.md); it is never linted.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "TID"]
ignore = ["E731", "E741"]

[tool.ruff.lint.per-file-ignores]
# Phase scripts are frozen records of what produced the published numbers: lint lightly.
"experiments/**" = ["E501", "B023", "B905"]
"src/objdel/train/fast.py" = ["TID251"]          # removed in E5 (file split)
"src/objdel/train/trl_adapter.py" = ["TID251"]   # becomes rl/trl_adapter.py in E5
"src/objdel/train/sample.py" = ["TID251"]        # removed in E5 (sample -> rl/trl_adapter.py)
"tests/test_trl_adapter.py" = ["TID251"]         # becomes tests/rl/test_trl_adapter.py in E5
"tests/test_train_fast.py" = ["TID251"]          # removed in E5

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Dotted names that import-linter cannot forbid. Each ban is added when its task lands.
"trl.trainer.grpo_trainer".msg = "private TRL module: only objdel.rl.trl_adapter may import it"
"trl.generation.vllm_generation".msg = "private TRL module: only objdel.rl.trl_adapter may import it"

[tool.ruff.lint.isort]
known-first-party = ["objdel", "experiments"]

[tool.vulture]
# Dead-code gate (`make dead`, tests/test_repo_hygiene.py). Each group below is used by name from outside the code.
paths = ["src", "experiments", "tests"]
min_confidence = 60
ignore_decorators = ["@pytest.fixture"]  # autouse fixtures (_no_real_secrets, clean_store)
ignore_names = [
  "on_*", "should_save", "should_training_stop",  # transformers TrainerCallback hooks and control flags
  "_get_train_sampler", "_inner_training_loop", "_generate_single_turn",  # Trainer / GRPOTrainer overrides and fakes
  "cmd_*",  # vast/policy.py subcommands, dispatched by name
  "pytestmark", "pre_tokenizer", "decoder", "projector_hidden_size", "is_main_process",
  "writeable", "atexit",  # numpy flag (topology.py), atexit hook (cache.py)
  "rid", "multimodal_fields", "has_tool_images", "return_tensors",  # fake signatures that callers use by keyword
  "clean_store", "no_nvtx_calls", "no_load", "mutant",  # fixtures requested by name for their side effect
  "repo_id", "trial", "stream", "num_images", "pixel_attention_mask", "image_sizes", "num_tiles", "spatial_shapes", "token_type_ids", "image_position_ids", "_save_checkpoint",  # fakes of library signatures
  "current_gradient_accumulation_steps",  # Trainer attribute that the code under test reads
  "TransferSyntaxUID", "MediaStorageSOPInstanceUID", "MediaStorageSOPClassUID",  # pydicom file-meta that save_as reads
]

[tool.importlinter]
root_package = "objdel"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers-interim"  # E0 -> E2; each move commit sets its own list (Implementation.md E0 table)
name = "objdel layers (current packages)"
type = "layers"
containers = ["objdel"]
layers = ["train", "eval", "reward | targets", "data", "checker | geometry"]
exhaustive = false
ignore_imports = [
    "objdel.eval.vision -> objdel.train.dataset",  # cycle edge; E5 removes it (vision moves to policy)
    "objdel.data.windows -> objdel.targets.**",  # B1.1; E3c removes it (targets merges into data)
    "objdel.data.quality -> objdel.targets.**",  # B1.3; E3c removes it
    "objdel.data.quality -> objdel.eval.ceiling",  # B1.3 DG14; E3b removes it (ceiling moves to verify)
    "objdel.data.* -> objdel.reward.**",  # B1.1 rl_eligible; E3b removes it (reward becomes verify)
    "objdel.data.windows -> objdel.reward",  # the same edge, through the package itself
]
broken_contract_guidance = "Move the import down or the code up."

[[tool.importlinter.contracts]]
id = "pure-core"
name = "the verifier side never imports the ML stack"
type = "forbidden"
source_modules = ["objdel.checker", "objdel.geometry", "objdel.reward", "objdel.targets", "objdel.data"]
forbidden_modules = ["torch", "trl", "transformers", "peft", "vllm", "datasets", "accelerate"]
broken_contract_guidance = "torch and friends live in the train/policy layers only."
