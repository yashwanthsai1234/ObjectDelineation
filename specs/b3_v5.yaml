# Run spec (objdel.core.spec); notes and history: docs/runbooks/specs.md#b3_v5
schema_version: 1
name: b3_v5
compute: {gpu: RTX_5090, cap_hours: 3.0}
bundle_view: views/lidc-bundle-v3
stages:
- kind: cmd
  name: build
  argv: [bash, -c, 'bash ops/box/run_box.sh --build-only && /opt/venv/bin/python -I -c "import objdel._gpucheck
      as g; assert g.build() == ''cuda''" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/verify/test_gpu_scoring.py']
- kind: cmd
  name: smoke
  argv: [bash, -c, 'OBJDEL_DATA_ROOT={data} /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider -m gpu tests/experiments/test_trl_adapter_equivalence.py::test_g08b_smoke']
- kind: eval
  name: eval_b1
  ckpt: '{rd}/b1/final'
  view: ['{data}/eval_views/lidc-val-shifted', '{data}/eval_views/lidc-val-edge']
  split: [val, val]
  out: ['{rd}/eval_b1v3_val_shifted', '{rd}/eval_b1v3_val_edge']
- kind: rl
  name: train
  soft: true
  model: qwen3-vl-2b
  ckpt: '{rd}/ckpt'
  train: '{data}/rows/lidc-train-b1-780'
  out: '{rd}/b3-v5'
  steps: 260
  save_steps: 50
  shared_prefix: true
  lr: 5.0e-05
  reward: v5
  grpo: {mask_truncated_completions: false, beta: 0.001, adam_epsilon: 1.0e-08}
  rows_revision: d2c8edb8e15534363ebbced8f839cecace49c495
  rows_manifest_sha256: a0f2c1d212b8c685e2b85aaac1aa9fa3de9c004ab310af13412d5aa630d4a6b9
  budget_usd: 2.2
- {kind: rl, name: merge, merge_last: true, model: qwen3-vl-2b, ckpt: '{rd}/ckpt', out: '{rd}/b3-v5'}
- kind: eval
  name: eval
  ckpt: '{rd}/b3-v5/final'
  view: ['{data}/eval_views/lidc-val-shifted', '{data}/eval_views/lidc-val-edge']
  split: [val, val]
  out: ['{rd}/eval_b3_val_shifted', '{rd}/eval_b3_val_edge']
- kind: cmd
  name: rc0
  soft: true
  argv: [-m, pytest, -q, -p, 'no:cacheprovider', -m, gpu, 'tests/rl/test_c_gpu.py::test_g_rc0_per_row_caps']
