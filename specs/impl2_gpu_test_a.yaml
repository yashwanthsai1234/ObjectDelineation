# Run spec (objdel.core.spec); notes and history: docs/runbooks/specs.md#impl2_gpu_test_a
schema_version: 1
name: impl2_gpu_test_a
compute: {gpu: RTX_5090, cap_hours: 3.05}
bundle_view: views/lidc-bundle-v3
stages:
- kind: cmd
  name: build
  argv: [bash, -c, 'bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c "import objdel._gpucheck
      as g; assert g.build() == ''cuda''" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/test_gpu_scoring.py']
- kind: cmd
  name: env_check
  argv: [bash, experiments/phase2/docker/env_check.sh, '{rd}/ckpt', '{rd}/env_check.json']
- kind: cmd
  name: gpu_check
  soft: true
  argv: [bash, -c, 'OBJDEL_DATA_ROOT={data} PY=/opt/venv/bin/python bash experiments/cuda_checker/run_box.sh --gpu-check;
      rc=$?; echo $rc > {rd}/gpu_check.exit; exit $rc']
- kind: cmd
  name: gpu_smoke
  soft: true
  argv: [-m, pytest, -m, gpu, 'tests/test_train_fast.py::test_g02_is_summary_no_sync', 'tests/test_train_fast.py::test_g08a_smoke']
