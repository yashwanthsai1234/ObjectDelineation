schema_version: 1
name: r5_shared
compute: {gpu: RTX_5090, cap_hours: 1.2}
bundle_view: views/lidc-bundle-v3
stages:
- kind: cmd
  name: box
  soft: true
  argv: [bash, -c, '(lscpu; nproc; cat /sys/fs/cgroup/cpu.max /sys/fs/cgroup/cpu*/cpu.cfs_*_us; nvidia-smi -q; df
      -h /dev/shm) > {rd}/box.txt 2>&1']
- kind: cmd
  name: env_check
  argv: [bash, experiments/phase2/docker/env_check.sh, '{rd}/ckpt', '{rd}/env_check.json']
- {kind: rl, name: base, model: qwen3-vl-2b, ckpt: '{rd}/ckpt', train: '{data}/prepared', out: '{rd}/base', steps: 15,
  save_steps: 15}
- {kind: rl, name: shared, soft: true, model: qwen3-vl-2b, ckpt: '{rd}/ckpt', train: '{data}/prepared', out: '{rd}/shared',
  steps: 15, save_steps: 15, shared_prefix: true}
