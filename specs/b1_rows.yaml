schema_version: 1
name: b1_rows
model: qwen3-vl-2b
compute: {gpu: RTX_5090, cap_hours: 9.5, budget_usd: 8.0}
rows: {name: lidc-train-b1-780, revision: 'd2c8edb8e15534363ebbced8f839cecace49c495',
  manifest_sha256: 'a0f2c1d212b8c685e2b85aaac1aa9fa3de9c004ab310af13412d5aa630d4a6b9'}
bundle_view: views/lidc-bundle-v3
stages:
- kind: cmd
  name: build
  argv: [bash, -c, 'bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c "import
      objdel._gpucheck as g; assert g.build() == ''cuda''" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider
      tests/verify/test_gpu_scoring.py']
- kind: cmd
  name: env_check
  argv: [bash, experiments/phase2/docker/env_check.sh, '{rd}/ckpt', '{rd}/env_check.json']
- kind: cmd
  name: gpu_smoke
  argv: [-m, pytest, -m, gpu, 'tests/experiments/test_trl_adapter_equivalence.py::test_g02_is_summary_no_sync', 'tests/experiments/test_trl_adapter_equivalence.py::test_g08a_smoke']
- {kind: rl, name: train, soft: true, ckpt: '{rd}/ckpt', out: '{rd}/b1-rows', steps: 780, save_steps: 50,
  shared_prefix: true, lr: 5.0e-05}
- {kind: rl, name: merge, merge_last: true, ckpt: '{rd}/ckpt', out: '{rd}/b1-rows'}
- kind: eval
  name: eval
  ckpt: '{rd}/b1-rows/final'
  view: ['{data}/eval_views/lidc-val-shifted', '{data}/eval_views/lidc-val-edge']
  split: [val, val]
  out: ['{rd}/eval_b1_val_shifted', '{rd}/eval_b1_val_edge']
