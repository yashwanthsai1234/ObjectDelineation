# Run spec (objdel.core.spec); notes and history: docs/runbooks/specs.md#c_speed
schema_version: 1
name: c_speed
compute: {gpu: RTX_5090, cap_hours: 3.0}
bundle_view: views/lidc-bundle-v3
stages:
- kind: cmd
  name: build
  argv: [bash, -c, 'bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c "import objdel._gpucheck
      as g; assert g.build() == ''cuda''" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/verify/test_gpu_scoring.py']
- kind: cmd
  name: env_check
  argv: [bash, experiments/phase2/docker/env_check.sh, '{rd}/ckpt', '{rd}/env_check.json']
- kind: cmd
  name: c_check
  argv: [-m, experiments.phase2.c_speed_check, --pixels, --sync, --model, qwen3-vl-2b, --ckpt, '{rd}/ckpt', --train, '{data}/rows/lidc-train-b1',
    --out, '{rd}', --steps, '20', --shared-prefix, --rows-revision, 34213dceb068128f1a1abf9c67aa65dd59bc1220, --rows-manifest-sha256,
    472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4]
- kind: cmd
  name: c0_base
  argv: [bash, -c, 'bash experiments/phase2/docker/nsys_capture.sh {rd} c0_base 16 17 -- /opt/venv/bin/python -I -m experiments.phase2.train_rl
      --model qwen3-vl-2b --ckpt {rd}/ckpt --train {data}/rows/lidc-train-b1 --rows-revision 34213dceb068128f1a1abf9c67aa65dd59bc1220
      --rows-manifest-sha256 472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4 --out {rd}/c0_base --steps
      20 --save-steps 1000 --shared-prefix']
- kind: cmd
  name: c_fast
  argv: [bash, -c, 'NSYS_TIMEOUT=1800 bash experiments/phase2/docker/nsys_capture.sh {rd} c_fast 16 17 -- /opt/venv/bin/python
      -I -m experiments.phase2.train_rl --model qwen3-vl-2b --ckpt {rd}/ckpt --train {data}/rows/lidc-train-b1 --rows-revision
      34213dceb068128f1a1abf9c67aa65dd59bc1220 --rows-manifest-sha256 472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4
      --out {rd}/c_fast --steps 40 --save-steps 1000 --shared-prefix --gpu-pixels auto --prompt-memo --host-meta --fast-sync
      --grpo ''{{"vllm_enable_sleep_mode": false}}'' --checks-from-step 18 --check-rope-every 1 --check-meta-every 1 --record-batches
      {rd}/c_check/arm_batches --expect-step1 {rd}/c0_base/rl.json --encode-check {rd}/c_check/encoder.json']
