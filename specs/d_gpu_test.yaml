# Run spec (objdel.core.spec); notes and history: docs/runbooks/specs.md#d_gpu_test
schema_version: 1
name: d_gpu_test
compute: {gpu: RTX_5090, cap_hours: 3.0}
bundle_view: views/lidc-bundle-v3
stages:
- kind: cmd
  name: gpu_check
  argv: [bash, -c, 'OBJDEL_DATA_ROOT={data} PY=/opt/venv/bin/python bash experiments/cuda_checker/run_box.sh --gpu-check']
- kind: cmd
  name: a_gpu
  argv: [bash, -c, '/opt/venv/bin/python -I -c ''import objdel._gpucheck as g; assert g.build() == "cuda"'' && OBJDEL_DATA_ROOT={data}
      /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/experiments/test_a_gpu.py::test_g02b_builds tests/experiments/test_a_gpu.py::test_g03_device_bytes']
