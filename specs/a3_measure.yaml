schema_version: 1
name: a3_measure
compute: {gpu: RTX_5090, cap_hours: 1.0}
bundle_view: views/lidc-bundle-v3
stages:
- kind: cmd
  name: box
  soft: true
  argv: [bash, -c, '(lscpu; nproc; nvidia-smi -q; df -h /dev/shm) > {rd}/box.txt 2>&1']
- kind: cmd
  name: build
  argv: [bash, -c, /opt/venv/bin/python -I -c 'import objdel._gpucheck as g; assert g.build() == "cuda"' || (bash
      experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c 'import objdel._gpucheck as
      g; assert g.build() == "cuda"')]
- kind: eval
  name: eval
  ckpt: '{rd}/ckpt'
  view: ['{data}/eval_views/lidc-val-edge', '{data}/eval_views/lidc-val-shifted']
  split: [val, val]
  out: ['{rd}/eval_val_edge', '{rd}/eval_val']
