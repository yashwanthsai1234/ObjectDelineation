# impl2_gpu_test.yaml split over two boxes rented at once (owner, 2026-11-09): box B = CUDA build, env check, eval smoke, RL smoke with merge-last and resume, final eval smoke.
# Steps 0, 1, 4, 5, 6, 7, 8, 9, 10, 11 of impl2_gpu_test.yaml, unchanged; launch config impl2_gpu_launch.yaml.
steps:
  - ["bash", "-c", "bash experiments/cuda_checker/run_box.sh --build-only && /opt/venv/bin/python -I -c \"import objdel._gpucheck as g; assert g.build() == 'cuda'\" && /opt/venv/bin/python -I -m pytest -q -p no:cacheprovider tests/test_gpu_scoring.py"]
  - ["bash", "experiments/phase2/docker/env_check.sh", "{rd}/ckpt", "{rd}/env_check.json"]
  - ["~", "-m", "experiments.phase2.final_eval", "--ckpt", "{rd}/ckpt", "--train", "{data}/prepared", "--view", "{data}/eval_views/lidc-val-shifted", "--split", "val", "--out", "{rd}/smoke_eval_r5", "--limit", "32"]
  - ["~", "-m", "experiments.phase2.train_rl", "--model", "qwen3-vl-2b", "--ckpt", "{rd}/ckpt", "--train", "{data}/rows/lidc-train-b1", "--out", "{rd}/smoke-rl", "--steps", "20", "--save-steps", "10", "--shared-prefix", "--lr", "5e-5", "--rows-revision", "34213dceb068128f1a1abf9c67aa65dd59bc1220", "--rows-manifest-sha256", "472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4", "--budget-usd", "1.85"]
  - ["bash", "-c", "d={rd}/smoke-rl; [ -f $d/rl.json ] && [ -d $d/trainer/checkpoint-10 ] && [ -d $d/trainer/checkpoint-20 ] && mv $d/rl.json {rd}/rl_run1.json && rm -rf $d/final $d/final_adapter $d/trainer/checkpoint-20"]
  - ["~", "-m", "experiments.phase2.train_rl", "--merge-last", "--model", "qwen3-vl-2b", "--ckpt", "{rd}/ckpt", "--out", "{rd}/smoke-rl"]
  - ["~", "bash", "-c", "/opt/venv/bin/python -I -c \"import json; d = json.load(open('{rd}/smoke-rl/rl.json')); assert d['partial'] is True and d['steps'] == 10, d\" && mv {rd}/smoke-rl/rl.json {rd}/rl_partial10.json && mv {rd}/smoke-rl/final {rd}/smoke-rl/final_partial10"]
  - ["~", "-m", "experiments.phase2.train_rl", "--model", "qwen3-vl-2b", "--ckpt", "{rd}/ckpt", "--train", "{data}/rows/lidc-train-b1", "--out", "{rd}/smoke-rl", "--steps", "20", "--save-steps", "10", "--shared-prefix", "--lr", "5e-5", "--resume", "--rows-revision", "34213dceb068128f1a1abf9c67aa65dd59bc1220", "--rows-manifest-sha256", "472738141f47bb0f1bdb1e98c679076cb73b979a4b8e256d7e2051c63e352fb4", "--budget-usd", "1.85"]
  - ["~", "bash", "-c", "/opt/venv/bin/python -I -c \"import json; d = json.load(open('{rd}/smoke-rl/rl.json')); assert d['steps'] == 20 and str(d['resumed_from']).endswith('checkpoint-10'), d\" && [ -d {rd}/smoke-rl/final ] && [ -d {rd}/smoke-rl/final_adapter ]"]
  - ["~", "-m", "experiments.phase2.final_eval", "--ckpt", "{rd}/smoke-rl/final", "--train", "{data}/prepared", "--view", "{data}/eval_views/lidc-val-shifted", "--split", "val", "--out", "{rd}/smoke_eval_final", "--limit", "16"]
