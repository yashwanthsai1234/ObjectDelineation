[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "polycore"
version = "0.1.0"
description = "Exact integer polygon core: rasterize (even-odd + nonzero), graded validity"
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["python/polycore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running exhaustive runs"]
